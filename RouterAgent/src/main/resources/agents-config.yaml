# A2A Multi-Agent Configuration
# 定义所有可用的 Agent 及其配置信息

agents:
  # 旅行推荐 Agent
  - name: travel-recommender
    url: http://localhost:9100
    description: Travel Recommendation Assistant - RAG-powered travel suggestions
    skills:
      - travel
      - recommendation
      - rag
      - trip-planning
      - tourism
    enabled: true
    priority: 20
    timeout: 60000
    retryAttempts: 2
    healthCheckInterval: 120
    metadata:
      provider: AI Travel Team
      version: "1.0.0"
      features:
        - intent-recognition
        - multi-category-search
        - context-aware
        - conversation-memory

