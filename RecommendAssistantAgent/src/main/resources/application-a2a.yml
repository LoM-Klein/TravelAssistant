# A2A Server 配置示例

server:
  port: 8080

# A2A Agent 配置
a2a:
  agent:
    name: "Travel Recommendation Assistant"
    description: "Intelligent travel recommendation assistant powered by RAG technology. Provides personalized travel suggestions using advanced retrieval and generation capabilities."

# Spring AI 配置（保持原有配置）
spring:
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-api-key}
    
# Elasticsearch 配置（保持原有配置）
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:elastic}
    password: ${ELASTICSEARCH_PASSWORD:}

# 日志配置
logging:
  level:
    com.ai.recommend: INFO
    com.google.a2a: DEBUG
    org.springframework.ai: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

